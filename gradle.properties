# Project
version=4.2.0
group=com.grim3212.assorted.lib
license=LGPL-3.0-only
issue_tracker=https://github.com/AssortedMods/AssortedLib/issues
# Build
# The AssortedBuild release this mod builds with. Minecraft, NeoForge, Fabric and tooling versions
# all come from it; bump it to move to a newer set.
assortedbuild_version=26.2.5
# Mod Options
mod_name=Assorted Lib
mod_author=Grim3212
mod_id=assortedlib
mod_description=Library mod to support the Assorted Mods.
# Knobs. Absent means off.
jei_enabled=false
client_gametests_enabled=true
neoforge_ats_enabled=true
common_runs_enabled=false
# Publishing
# Where a release goes. The release job checks both ids before it uploads anything: a
# blank one publishes to nowhere and reports success.
modrinth_id=KkmxwW72
curseforge_id=851677
# Only the Discord announcement reads the slug, but it is also the one human-readable name of
# the CurseForge project anywhere in the repo.
curseforge_slug=assorted-lib
# The default release channel: release, beta or alpha. -PreleaseType overrides it.
release_type=release
# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.configuration-cache=false
